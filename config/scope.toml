# Утверждённый scope данных проекта.
#
# Конфигурация сформирована на исследовательском этапе и определяет:
# - целевой исторический период;
# - набор акций;
# - набор индексов;
# - режимы торгов;
# - валюты Банка России.


# Целевой исторический период проекта
[history]
date_from = 2020-01-03
date_to = 2021-01-31


# MOEX: акции
#
# Все выбранные акции загружаются с основного режима торгов TQBR.
[moex.securities]
board = "TQBR"

[moex.securities.selected]
SBER = "Сбербанк"
GAZP = "Газпром"
VTBR = "ВТБ"
T = "Т-Технологии"
LKOH = "ЛУКОЙЛ"
NVTK = "НОВАТЭК"
ROSN = "Роснефть"
GMKN = "Норникель"
YDEX = "Яндекс"
PLZL = "Полюс"
SMLT = "Самолет"
OZON = "Ozon"
X5 = "X5"
RUAL = "РУСАЛ"
TATN = "Татнефть"
AFKS = "АФК Система"
MOEX = "Московская биржа"
PIKK = "ПИК"
POSI = "Positive Technologies"
AQUA = "ИНАРКТИКА"


# MOEX: рыночный и отраслевые индексы
#
# Для каждого индекса рядом с названием хранится board,
# используемый для получения его исторических данных.
[moex.indices.IMOEX]
name = "Индекс МосБиржи"
board = "SNDX"

[moex.indices.MOEXOG]
name = "Индекс МосБиржи нефти и газа"
board = "SNDX"

[moex.indices.MOEXFN]
name = "Индекс МосБиржи финансов"
board = "SNDX"

[moex.indices.MOEXIT]
name = "Индекс МосБиржи информационных технологий"
board = "RTSI"

[moex.indices.MOEXMM]
name = "Индекс МосБиржи металлов и добычи"
board = "SNDX"


# Валюты Банка России
#
# Ключ — внутренний идентификатор валюты в API Банка России.
# Значение — код валюты, используемый в проекте.
[cbr.currencies]
R01235 = "USD"
R01375 = "CNY"
